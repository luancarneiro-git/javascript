<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="shortcut icon" href="vasco-favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Contador</h1>
        </header>
        <main>
            <div class="conteudo">
                <p>incio: <input type="number" id="inicio"></p>
                <p>fim: <input type="number" id="fim"></p>
                <p>passo: <input type="number" id="passo"></p>
                <p><input type="button" value="contar" id="contar" onclick="contar()"></p>
            </div>
            <div class="elementos">
                <p>contando:</p>
                <p id="contagem">iniciando contagem...</p>
            </div>
        </main>
        <footer>
            <p>&copy; LUAN CARNEIRO</p>
        </footer>
    </div>
</body>
</html>
